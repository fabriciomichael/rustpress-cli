[package]
name = "rustpress-cli"
version = "0.1.0"
edition = "2024"
description = "Official command-line interface for the RustPress web framework"
license = "MIT"
repository = "https://github.com/fabriciomichael/rustpress-cli"
homepage = "https://github.com/fabriciomichael/rustpress-cli"
readme = "README.md"
keywords = ["rustpress", "cli", "web", "framework"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rustpress"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }